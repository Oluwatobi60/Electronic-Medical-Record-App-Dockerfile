services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: eclicnic-backend
    container_name: eclicnic_web
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./eclicnic-backend:/app
      - ./logs/django:/app/logs
    expose:
      - "8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    networks:
      - eclicnic-network

  nginx:
    image: nginx:alpine
    container_name: eclicnic_nginx
    restart: unless-stopped
    ports:
      - "0.0.0.0:8081:80"
    volumes:
      - ./eclicnic-backend:/app
      - ./frontend-dist:/usr/share/nginx/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - web
    networks:
      - eclicnic-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: eclicnic_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@test.com
      PGADMIN_DEFAULT_PASSWORD: admin234
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db
    networks:
      - eclicnic-network

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: eclicnic_pgbouncer
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-eclicnic}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-eclicnicpass}
      DB_NAME: ${POSTGRES_DB:-eclicnicapp}
      LISTEN_PORT: 6432
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 20
      MIN_POOL_SIZE: 5
      RESERVE_POOL_SIZE: 5
      AUTH_TYPE: scram-sha-256
      ADMIN_USERS: ${POSTGRES_USER:-eclicnic}
      IGNORE_STARTUP_PARAMETERS: extra_float_digits,options
    ports:
      - "6432:6432"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h localhost -p 6432 -U ${POSTGRES_USER:-eclicnic}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - eclicnic-network

  db:
    image: postgres:16-alpine
    container_name: eclicnic_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eclicnicapp}
      POSTGRES_USER: ${POSTGRES_USER:-eclicnic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eclicnicpass}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eclicnic} -d ${POSTGRES_DB:-eclicnicapp}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - eclicnic-network

networks:
  eclicnic-network:
    driver: bridge

volumes:
  pgadmin_data:
    driver: local
